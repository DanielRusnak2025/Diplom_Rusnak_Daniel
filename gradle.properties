# Gradle daemon JVM heap.
# Default in Gradle 9.8: -Xmx512m -Dfile.encoding=UTF-8
# Raised to 3 GB to prevent OOM during androidApp compilation (AGP 9.5.1 + Kotlin 2.4.21).
# ParallelGC chosen for throughput on a build-only process (no latency requirement).
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin daemon heap.
# Default in KGP 2.x: -Xmx1500m
# Raised to 2 GB; daemon is separate from the Gradle daemon above.
kotlin.daemon.jvmargs=-Xmx2g

# AndroidX is mandatory since AGP 7.0 and default-true since AGP 4.2.
# Retained here for explicitness; has no effect in AGP 9.5.1 (always enabled).
# Reference: AGP 9.0 migration guide — android.useAndroidX is accepted but no-op.
android.useAndroidX=true
