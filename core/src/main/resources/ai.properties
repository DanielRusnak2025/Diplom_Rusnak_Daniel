# Ollama (local AI)
ollama.url=http://localhost:11434
ollama.model=llama3.2
ollama.max_text_length=2000

# Page fetching
fetch.timeout.seconds=15
fetch.max.bytes=2000000
fetch.max.redirects=5

# Keyword scoring
keyword.bonus.max=2

# Language detection — ISO 639-1 codes, comma-separated
languages.allowed=en,ru,de,ro
