# NewsDove — taxonomy seed (categories, subtopics, keywords, regions)
# Source for Flyway migration V5 (tag: kind = CATEGORY / SUBTOPIC, parent_id, keywords, description).
#
# Structure
#   categories[].key / name / description  -> tag (kind = CATEGORY); description goes into the AI prompt
#   categories[].subtopics[]               -> tag (kind = SUBTOPIC, parent_id = category)
#   Every category automatically gets one extra subtopic "general" (name "General", no keywords):
#   the model picks it when the article belongs to the category but no subtopic fits.
#   regions[]                              -> fixed list; an article's region is computed from
#                                             dictionary entities and always mapped to one of these keys.
#
# Keyword matching (algorithm, no AI) — applied to the title + first part of the article text:
#   - case-insensitive; text is normalised to lower case; "ё" is treated as "е"
#   - "word"        whole word only            ("eu" matches "EU", not "Europe")
#   - "word*"       word starting with prefix  ("election*" matches "elections", "electoral")
#   - "*word*"      substring inside a word    (German compounds: "*wahl*" matches "Bundestagswahl")
#   - "a* b*"       consecutive words, each rule applied per word ("мирн* переговор*")
#   A rule is counted once per article even if it appears under several languages.
#   Keywords only add a bonus to a category the AI already chose; they never assign a category alone.
#
# version: bump when keys/names change; stored in article.taxonomy_version.

version: 1

regions:
  - { key: north_america,       name: "North America" }
  - { key: latin_america,       name: "Latin America" }
  - { key: western_europe,      name: "Western Europe" }
  - { key: northern_europe,     name: "Northern Europe" }
  - { key: southern_europe,     name: "Southern Europe" }
  - { key: eastern_europe,      name: "Eastern Europe" }
  - { key: russia_central_asia, name: "Russia & Central Asia" }
  - { key: middle_east,         name: "Middle East" }
  - { key: africa,              name: "Africa" }
  - { key: south_asia,          name: "South Asia" }
  - { key: east_southeast_asia, name: "East & Southeast Asia" }
  - { key: global,              name: "Global" }

