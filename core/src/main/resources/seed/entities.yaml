# NewsDove — entity dictionary (countries, cities/places, organisations, region names)
# Source for Flyway migration V11 (entity + entity_alias) and for EntityMatcher (stage 3d).
#
# Purpose: determine an article's region (one of the 12 region keys from taxonomy.yaml) by an
# algorithm, without AI. Entities are NOT tags: the AI never sees or produces them.
#
# Structure
#   countries[]      key, region, aliases{en,ru,de}, acronyms[]
#   places[]         key, country (-> region of that country), aliases, acronyms   (cities, regions, institutions)
#   organisations[]  key, region (global = does not vote), aliases, acronyms
#   region_names[]   key, region, aliases   ("Middle East", "Balkans", ...)
#
# Alias rules (same syntax as taxonomy keywords):
#   - case-insensitive; text normalised to lower case; "ё" is treated as "е"
#   - "word" whole word, "word*" prefix, "*word*" substring, "a* b*" consecutive words
#   - hyphens/apostrophes split words: "Нью-Йорк" is written as the phrase "Нью Йорк"
#   - aliases are applied for the detected language of the article only (en / ru / de)
# Acronyms: case-SENSITIVE whole words, applied for every language ("US" never matches "us").
#   Acronyms are skipped inside a fully upper-case title or sentence ("WHO WON" is not the WHO).
#
# Matching algorithm (EntityMatcher):
#   1. On overlapping matches the longest alias wins ("Papua New Guinea" beats "Guinea").
#   2. Each entity counts once per article; a mention in the title counts 2, in the text 1.
#   3. Votes: country/place -> region of its country; organisation/region_name -> its region;
#      region "global" does not vote.
#   4. article.region = region with the most votes; tie or no votes -> "global".
#
# Ambiguous names are deliberately left out or narrowed: e.g. English "Chad", "Jordan", "Georgia",
# "Polish", "US" (pronoun), Russian "Того", "Газа" (газ), "Инди*" (индивидуальный), "Грузи*" (грузить).
#
# version: bump when keys change.

version: 1

