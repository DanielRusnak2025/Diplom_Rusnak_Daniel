[versions]
kotlin        = "2.4.21"
kotlinxSer    = "1.12.0"
junit         = "6.1.3"
hibernate     = "7.2.3.Final"
mysql         = "9.0.0"
jbossLogging  = "3.6.1.Final"
jakartaMail   = "2.0.1"
okhttp        = "4.12.0"
jackson       = "2.17.0"
jsoup         = "1.17.2"
lingua        = "1.2.2"
slf4j         = "2.0.20"
logback       = "1.6.5"
flyway        = "13.11.1"
argon2-jvm    = "2.12"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSer" }
hibernate-core    = { module = "org.hibernate.orm:hibernate-core",            version.ref = "hibernate"    }
mysql-connector-j = { module = "com.mysql:mysql-connector-j",                 version.ref = "mysql"        }
jboss-logging     = { module = "org.jboss.logging:jboss-logging",             version.ref = "jbossLogging" }
jakarta-mail      = { module = "com.sun.mail:jakarta.mail",                   version.ref = "jakartaMail"  }
okhttp            = { module = "com.squareup.okhttp3:okhttp",                 version.ref = "okhttp"       }
jackson-databind  = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson"      }
jsoup             = { module = "org.jsoup:jsoup",                             version.ref = "jsoup"        }
lingua            = { module = "com.github.pemistahl:lingua",                 version.ref = "lingua"       }
slf4j-api         = { module = "org.slf4j:slf4j-api",                        version.ref = "slf4j"        }
logback-classic   = { module = "ch.qos.logback:logback-classic",             version.ref = "logback"      }
junit-jupiter     = { module = "org.junit.jupiter:junit-jupiter",            version.ref = "junit"        }
junit-launcher    = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit"       }
flyway-core       = { module = "org.flywaydb:flyway-core",                   version.ref = "flyway"      }
flyway-mysql      = { module = "org.flywaydb:flyway-mysql",                  version.ref = "flyway"      }
argon2-jvm        = { module = "de.mkammerer:argon2-jvm",                    version.ref = "argon2-jvm"  }

[plugins]
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",                    version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
