[versions]
kotlin        = "2.4.21"
kotlinxSer    = "1.12.0"
junit         = "6.1.3"
hibernate     = "7.2.3.Final"
mysql         = "9.0.0"
jbossLogging  = "3.6.1.Final"
jakartaMail   = "2.0.1"
okhttp        = "5.5.1"
jacksonBom    = "2.22.0"
jsoup         = "1.23.2"
lingua        = "1.2.2"
slf4j         = "2.0.20"
logback       = "1.6.5"
flyway        = "13.11.1"
argon2-jvm    = "2.12"
ktor          = "3.6.1"
mockk         = "1.14.9"
agp              = "9.5.1"
composeBom       = "2026.09.00"
activityCompose  = "1.10.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSer" }
hibernate-core    = { module = "org.hibernate.orm:hibernate-core",            version.ref = "hibernate"    }
mysql-connector-j = { module = "com.mysql:mysql-connector-j",                 version.ref = "mysql"        }
jboss-logging     = { module = "org.jboss.logging:jboss-logging",             version.ref = "jbossLogging" }
jakarta-mail      = { module = "com.sun.mail:jakarta.mail",                   version.ref = "jakartaMail"  }
okhttp            = { module = "com.squareup.okhttp3:okhttp",                 version.ref = "okhttp"       }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver",      version.ref = "okhttp"       }
jackson-bom             = { module = "com.fasterxml.jackson:jackson-bom",                            version.ref = "jacksonBom" }
jackson-databind        = { module = "com.fasterxml.jackson.core:jackson-databind"                                         }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"                            }
jsoup             = { module = "org.jsoup:jsoup",                             version.ref = "jsoup"        }
lingua            = { module = "com.github.pemistahl:lingua",                 version.ref = "lingua"       }
slf4j-api         = { module = "org.slf4j:slf4j-api",                        version.ref = "slf4j"        }
logback-classic   = { module = "ch.qos.logback:logback-classic",             version.ref = "logback"      }
junit-jupiter     = { module = "org.junit.jupiter:junit-jupiter",            version.ref = "junit"        }
junit-launcher    = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit"       }
flyway-core       = { module = "org.flywaydb:flyway-core",                   version.ref = "flyway"      }
flyway-mysql      = { module = "org.flywaydb:flyway-mysql",                  version.ref = "flyway"      }
argon2-jvm        = { module = "de.mkammerer:argon2-jvm",                    version.ref = "argon2-jvm"  }
ktor-server-core         = { module = "io.ktor:ktor-server-core",                  version.ref = "ktor" }
ktor-server-netty        = { module = "io.ktor:ktor-server-netty",                 version.ref = "ktor" }
ktor-server-content-neg  = { module = "io.ktor:ktor-server-content-negotiation",   version.ref = "ktor" }
ktor-serialization-json  = { module = "io.ktor:ktor-serialization-kotlinx-json",   version.ref = "ktor" }
ktor-server-auth-jwt     = { module = "io.ktor:ktor-server-auth-jwt",              version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages",          version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging",          version.ref = "ktor" }
ktor-server-test-host    = { module = "io.ktor:ktor-server-test-host",             version.ref = "ktor" }
ktor-client-content-neg  = { module = "io.ktor:ktor-client-content-negotiation",   version.ref = "ktor" }
mockk                    = { module = "io.mockk:mockk",                            version.ref = "mockk" }
compose-bom              = { module = "androidx.compose:compose-bom",               version.ref = "composeBom" }
compose-ui               = { module = "androidx.compose.ui:ui"                                                 }
compose-material3        = { module = "androidx.compose.material3:material3"                                   }
compose-activity         = { module = "androidx.activity:activity-compose"                                     }

[plugins]
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",                    version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
agp-application      = { id = "com.android.application",                    version.ref = "agp"    }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
